<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background gradient (purple to magenta like Claude Code Pilot) -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#5D3A8E"/>
            <stop offset="100%" style="stop-color:#A83279"/>
        </linearGradient>
    </defs>
    <rect width="800" height="150" fill="url(#bgGradient)"/>

    <!-- Decorative gold line at top -->
    <rect x="0" y="0" width="800" height="4" fill="#D4AF37"/>

    <!-- Logo icon -->
    <g transform="translate(50, 30)">
        <rect width="90" height="90" rx="18" fill="#2a2a2a"/>
        <circle cx="45" cy="38" r="22" stroke="#D4AF37" stroke-width="5" fill="none"/>
        <circle cx="45" cy="38" r="8" fill="#D4AF37"/>
        <line x1="45" y1="60" x2="45" y2="76" stroke="#D4AF37" stroke-width="5" stroke-linecap="round"/>
        <line x1="30" y1="74" x2="60" y2="74" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Text: Hubble.AI -->
    <text x="160" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">Hubble.AI</text>

    <!-- Subtitle -->
    <text x="160" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#D4AF37">Treasury Cash Flow Forecasting · Progress Update</text>

    <!-- Date badge on right -->
    <g transform="translate(620, 50)">
        <rect width="130" height="50" rx="8" fill="#D4AF37" opacity="0.15"/>
        <text x="65" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#D4AF37" text-anchor="middle">DECEMBER</text>
        <text x="65" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#D4AF37" text-anchor="middle">2025</text>
    </g>
</svg>
